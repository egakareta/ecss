[package]
name = "ecss"
version = "0.1.0"
edition = "2024"
description = "CSS class styling for egui widgets."
documentation = "https://docs.rs/ecss"
repository = "https://github.com/egakareta/ecss"
license = "MIT"

[dependencies]
cssparser = "0.38"
egui = "0.36"
ehttp = { version = "0.7.1", features = ["native-async"] }
futures-util = "0.3"
precomputed-hash = "0.1"
selectors = "0.41.0"
taffy = { version = "0.15", default-features = false, features = [
  "std",
  "taffy_tree",
  "block_layout",
  "flexbox",
  "grid",
  "content_size",
  "float_layout",
  "parse",
  "calc",
  "detailed_layout_info",
] }
unicode-linebreak = "0.1.5"
wuff = "0.2.9"

[dev-dependencies]
eframe = { version = "0.36", default-features = false, features = ["wayland", "wgpu"] }
futures-channel = "0.3"
paste = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-test = "0.3"
wgpu = { version = "30", default-features = false, features = ["std", "webgl", "webgpu", "wgsl"] }
