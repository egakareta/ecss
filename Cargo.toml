[package]
name = "ecss"
version = "0.1.0"
edition = "2024"
description = "Cascading style sheet (CSS) support for egui"
documentation = "https://docs.rs/ecss"
repository = "https://github.com/egakareta/ecss"
license = "MIT"

[dependencies]
base64 = "0.22"
cssparser = "0.38"
egui = { version = "0.37", features = ["default_fonts"] }
ehttp = { version = "0.7", features = ["native-async"] }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
precomputed-hash = "0.1"
resvg = { version = "0.48", default-features = false, features = [
  "raster-images",
  "svgz",
  "system-fonts",
  "text",
] }
selectors = "0.41"
smallvec = "1"
taffy = { version = "0.15", default-features = false, features = [
  "block_layout",
  "calc",
  "content_size",
  "detailed_layout_info",
  "flexbox",
  "float_layout",
  "grid",
  "parse",
  "std",
  "taffy_tree",
] }
unicode-general-category = "1.1"
unicode-linebreak = "0.1"
wuff = "0.2"

[dev-dependencies]
eframe = { version = "0.37", default-features = false, features = ["wayland", "wgpu"] }
futures-channel = "0.3"
log = "0.4"
paste = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
pollster = { version = "1", features = ["macro"] }

[target.'cfg(target_arch = "wasm32")'.dev-dependencies]
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlCanvasElement", "Window"] }
wgpu = { version = "30", default-features = false, features = ["std", "webgl", "webgpu", "wgsl"] }
